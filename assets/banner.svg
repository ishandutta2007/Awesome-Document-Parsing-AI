<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.8)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0)" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(160px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes floatDoc {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -32; }
    }
    @keyframes textShimmer {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #c084fc; }
      100% { stop-color: #38bdf8; }
    }
    .scanner {
      animation: scanLine 4s ease-in-out infinite;
    }
    .orb-1 {
      animation: pulseOrb 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 7s ease-in-out infinite 1s;
      transform-origin: 1000px 300px;
    }
    .doc-preview {
      animation: floatDoc 5s ease-in-out infinite;
      transform-origin: center;
    }
    .dashed-box {
      stroke-dasharray: 6 4;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="100" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.25" />
  <circle class="orb-2" cx="1020" cy="280" r="160" fill="#06b6d4" filter="url(#glow)" opacity="0.2" />
  <circle cx="600" cy="200" r="220" fill="#a855f7" filter="url(#glow)" opacity="0.1" />

  <!-- Futuristic Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Left Content: Title & Taglines -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <rect x="400" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="428" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">INTELLIGENT DOCUMENT AI</text>

    <!-- Main Title -->
    <text x="400" y="78" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">Awesome Document</text>
    <text x="400" y="130" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">Parsing AI 📄⚡</text>

    <!-- Subtitle / Badges -->
    <text x="400" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The Curated Guide to SOTA IDP, OCR, Vision-Language Models &amp; Document Extraction
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 202)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="45" y="17" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">OCR + VLM</text>

      <rect x="100" y="0" width="125" height="26" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
      <text x="162" y="17" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Layout Analysis</text>

      <rect x="235" y="0" width="130" height="26" rx="6" fill="#4a044e" stroke="#c026d3" stroke-width="1" />
      <text x="300" y="17" fill="#f0abfc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Table Extraction</text>

      <rect x="375" y="0" width="115" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="432" y="17" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">RAG &amp; Agents</text>
    </g>
  </g>

  <!-- Right Visual: Document Parsing Interactive Wireframe -->
  <g class="doc-preview" transform="translate(860, 60)">
    <!-- Document Card Shadow / Glow -->
    <rect x="-10" y="-10" width="250" height="300" rx="14" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

    <!-- Document Card Body -->
    <rect x="0" y="0" width="230" height="280" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Document Header Elements -->
    <rect x="20" y="24" width="70" height="10" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="100" y="26" width="90" height="6" rx="2" fill="#475569" />

    <!-- Document Body Lines -->
    <rect x="20" y="48" width="180" height="5" rx="2" fill="#334155" />
    <rect x="20" y="60" width="150" height="5" rx="2" fill="#334155" />
    <rect x="20" y="72" width="165" height="5" rx="2" fill="#334155" />

    <!-- Layout Analysis Bounding Box 1: Table -->
    <rect class="dashed-box" x="18" y="95" width="194" height="75" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#c084fc" stroke-width="1.5" />
    <rect x="26" y="103" width="40" height="12" rx="2" fill="#a855f7" opacity="0.8" />
    <text x="72" y="112" fill="#e9d5ff" font-family="sans-serif" font-size="8" font-weight="700">TABLE_DETECTION</text>

    <!-- Table Inner Lines -->
    <line x1="26" y1="124" x2="202" y2="124" stroke="#475569" stroke-width="1" />
    <line x1="26" y1="140" x2="202" y2="140" stroke="#334155" stroke-width="1" />
    <line x1="26" y1="156" x2="202" y2="156" stroke="#334155" stroke-width="1" />
    <line x1="85" y1="118" x2="85" y2="162" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="145" y1="118" x2="145" y2="162" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Layout Analysis Bounding Box 2: Key-Value / OCR -->
    <rect class="dashed-box" x="18" y="185" width="194" height="65" rx="4" fill="#0c4a6e" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="26" y="193" width="48" height="12" rx="2" fill="#0284c7" opacity="0.8" />
    <text x="80" y="202" fill="#bae6fd" font-family="sans-serif" font-size="8" font-weight="700">KEY_VALUE_PAIR</text>

    <rect x="26" y="215" width="70" height="5" rx="2" fill="#64748b" />
    <rect x="110" y="215" width="80" height="5" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="26" y="230" width="60" height="5" rx="2" fill="#64748b" />
    <rect x="110" y="230" width="75" height="5" rx="2" fill="#38bdf8" opacity="0.8" />

    <!-- Dynamic Scanning Laser Beam -->
    <g class="scanner">
      <rect x="5" y="40" width="220" height="4" fill="url(#laserGrad)" filter="url(#glow)" />
      <line x1="5" y1="42" x2="225" y2="42" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
    </g>
  </g>
</svg>
